displayName="Vehicle Restored"
authors="Numek, MrCrayfish (original mod)"
credits="Based on MrCrayfish's Vehicle Mod: its vehicles, models, textures and sounds are the work of MrCrayfish, and Phylogeny worked on the original mod. The tank, the advanced workshop and the military crate are new in Vehicle Restored (by Numek); the tank's camouflage is the public domain M81 woodland pattern."
description='''
Brings MrCrayfish's Vehicle Mod back to Minecraft 1.20.1: cars, bikes, boats, planes, trailers, fuel production and more. With Furniture Restored installed, you can also drive a sofa, fly a bath and pilot a sofacopter. New in 2.0: a main battle tank, built in the advanced workshop.

Unofficial port, not affiliated with or endorsed by MrCrayfish. Please do not report problems with this mod to him.
'''

